# DEVELOPMENT DATABASE (Docker Compose PostgreSql)
spring.datasource.url=jdbc:postgresql://localhost:5432/university_db
spring.datasource.username=admin
spring.datasource.password=password

# env
spring.config.import=optional:file:.env[.properties]

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot Docker Compose automatic lifecycle hook
spring.docker.compose.lifecycle-management=start-only

# FILE STORAGE
aws.s3.endpoint=${S3_URL:http://localhost:9000}
aws.s3.access-key=${S3_ACCESS_KEY:admin}
aws.s3.secret-key=${S3_SECRET_KEY:password123}
aws.s3.region=${S3_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET:university-files}

# FRONTEND CORS CONNECTION
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true